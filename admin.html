/* ---------- утилиты ---------- */
function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function get(o,p){var a=String(p).split('.'),v=o;for(var i=0;i<a.length;i++){if(v==null)return '';v=v[a[i]];}return v==null?'':v;}
function set(o,p,val){var a=String(p).split('.'),v=o;for(var i=0;i<a.length-1;i++){if(v[a[i]]==null)v[a[i]]=(/^\d+$/.test(a[i+1])?[]:{});v=v[a[i]];}v[a[a.length-1]]=val;}
function dirty(){DIRTY=true;var e=document.getElementById('admDirty');e.textContent='есть несохранённые правки';e.className='adm-dirty';saveDraft();}
function saveDraft(){try{localStorage.setItem('izi_draft',JSON.stringify(C));}catch(e){}}
function log(msg,cls){var el=document.getElementById('admLog');if(!el)return;
  el.innerHTML+=(cls?'<'+cls+'>'+esc(msg)+'</'+cls+'>':esc(msg))+'\n';el.scrollTop=el.scrollHeight;}

/* ---------- загрузка ---------- */
function boot(){
  Promise.all([
    fetch('data/content.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
    fetch('data/images.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():[];}).catch(function(){return [];})
  ]).then(function(a){
    IMGS=a[1]||[];
    var draft=null; try{draft=JSON.parse(localStorage.getItem('izi_draft')||'null');}catch(e){}
    if(a[0]&&draft&&confirm('В браузере есть несохранённый черновик. Продолжить с ним?\n\nОК — черновик, Отмена — то, что опубликовано на сайте.')){
      C=draft; document.getElementById('admSrc').textContent='черновик из браузера'; DIRTY=true;
      document.getElementById('admDirty').textContent='есть несохранённые правки';
      document.getElementById('admDirty').className='adm-dirty';
    } else {
      C=a[0]; localStorage.removeItem('izi_draft');
      document.getElementById('admSrc').textContent = C? ('data/content.json · версия '+(C.version||'—')) : 'файл не найден';
    }
    if(!C){ document.getElementById('admMain').innerHTML='<h2>Не нашёл data/content.json</h2>'+
      '<p class="adm-lede">Редактор открывается только вместе с сайтом. Откройте его по адресу сайта, а не двойным щелчком по файлу.</p>'; return; }
    nav(); show(SEC);
  });
}

function nav(){
  var h='<em>Содержание</em>';
  ORDER.forEach(function(k){ h+='<button type="button" onclick="show(\''+k+'\')" id="nav-'+k+'">'+SCHEMA[k].n+'</button>'; });
  h+='<em>Прочее</em>';
  h+='<button type="button" onclick="show(\'imgs\')" id="nav-imgs">Фотографии</button>';
  h+='<button type="button" onclick="show(\'eb\')" id="nav-eb">Раннее бронирование</button>';
  h+='<button type="button" onclick="show(\'set\')" id="nav-set">Публикация</button>';
  document.getElementById('admNav').innerHTML=h;
}
function show(k){
  SEC=k;
  document.querySelectorAll('.adm-nav button').forEach(function(b){b.classList.remove('on');});
  var a=document.getElementById('nav-'+k); if(a)a.classList.add('on');
  var m=document.getElementById('admMain');
  if(k==='imgs') return imgsView(m);
  if(k==='set') return setView(m);
  if(k==='eb') return ebView(m);
  var S=SCHEMA[k];
  m.innerHTML='<h2>'+S.n+'</h2><p class="adm-lede">'+S.lede+'</p><div id="secBody"></div>';
  render(k);
  window.scrollTo(0,0);
}

/* ---------- отрисовка форм ---------- */
function fieldHtml(path,f,val){
  var id='f_'+path.replace(/[^a-z0-9]/gi,'_');
  var w=f.w?' style="grid-column:1/-1"':'';
  var inner='';
  if(f.t==='area') inner='<textarea id="'+id+'" oninput="edit(this,\''+path+'\',\'s\')">'+esc(val)+'</textarea>';
  else if(f.t==='lines') inner='<textarea id="'+id+'" oninput="edit(this,\''+path+'\',\'lines\')">'+esc((val||[]).join('\n'))+'</textarea>';
  else if(f.t==='num') inner='<input type="number" step="any" id="'+id+'" value="'+esc(val)+'" oninput="edit(this,\''+path+'\',\'n\')">';
  else if(f.t==='bool') return '<div class="fld bool"'+w+'><input type="checkbox" id="'+id+'"'+(val?' checked':'')+' onchange="edit(this,\''+path+'\',\'b\')"><label for="'+id+'">'+f.n+'</label></div>';
  else if(f.t==='sel') inner='<select id="'+id+'" onchange="edit(this,\''+path+'\',\'s\')">'+f.opt.map(function(o){
      return '<option value="'+esc(o[0])+'"'+(String(val)===String(o[0])?' selected':'')+'>'+esc(o[1])+'</option>';}).join('')+'</select>';
  else if(f.t==='res') inner='<select id="'+id+'" onchange="edit(this,\''+path+'\',\'s\')">'+(C.resorts||[]).map(function(r){
      return '<option value="'+esc(r.k)+'"'+(val===r.k?' selected':'')+'>'+esc(r.n)+' ('+esc(r.k)+')</option>';}).join('')+'</select>';
  else if(f.t==='img') inner=imgSel(id,path,val);
  else inner='<input type="text" id="'+id+'" value="'+esc(val)+'" oninput="edit(this,\''+path+'\',\'s\')">';
  return '<div class="fld"'+w+'><label for="'+id+'">'+f.n+'</label>'+inner+
    (f.h?'<span class="hint">'+esc(f.h)+'</span>':'')+'</div>';
}
/* В списке — и файлы с сайта, и только что загруженные, и всё, на что уже
   ссылаются данные: иначе опубликованная вчера картинка пропала бы из выбора. */
function usedImgs(){
  var out=[];
  try{
    (C.resorts||[]).forEach(function(r){ (r.tabs||[]).forEach(function(t){ if(t&&t[2]) out.push(t[2]); }); });
    Object.keys(C.stay||{}).forEach(function(k){ (C.stay[k]||[]).forEach(function(h){
      if(h.img) out.push(h.img); (h.gal||[]).forEach(function(g){ if(g) out.push(g); }); }); });
  }catch(e){}
  return out;
}
function allImgs(){
  return IMGS.concat(Object.keys(NEWIMG)).concat(usedImgs())
    .filter(function(v,i,a){ return v && a.indexOf(v)===i; }).sort();
}
function imgSel(id,path,val){
  var all=allImgs();
  return '<div class="imgpick"><img src="'+imgSrc(val)+'" alt="" onerror="this.style.opacity=.2">'+
    '<select id="'+id+'" onchange="edit(this,\''+path+'\',\'s\');show(SEC)"><option value="">— нет —</option>'+
    all.map(function(k){return '<option value="'+esc(k)+'"'+(val===k?' selected':'')+'>'+esc(k)+'</option>';}).join('')+
    '</select></div>';
}
function imgSrc(k){ if(!k) return ''; if(NEWIMG[k]) return NEWIMG[k].url; return 'assets/img/'+k+'.webp'; }

function edit(el,path,kind){
  var v = kind==='b'? el.checked : (kind==='n'? (el.value===''?'':parseFloat(el.value)) : (kind==='lines'? el.value.split('\n').filter(function(x){return x.trim();}) : el.value));
  set(C,path,v); dirty();
}

function group(title,sub,body,one){
  return '<div class="grp"><div class="grp-h"><b>'+esc(title)+'</b><i>'+esc(sub||'')+'</i></div>'+
    '<div class="grp-b'+(one?' one':'')+'">'+body+'</div></div>';
}
function fieldsFor(S,path,obj){
  return S.f.map(function(f){
    if(f.t==='tbl') return tblHtml(path+'.'+f.k,f,get(obj,f.k)||[]);
    if(f.t==='list') return listHtml(path+'.'+f.k,f,get(obj,f.k)||[]);
    if(f.t==='gal') return galHtml(path+'.'+f.k,f,get(obj,f.k)||[]);
    return fieldHtml(path+'.'+f.k,f,get(obj,f.k));
  }).join('');
}
function tblHtml(path,f,arr){
  var h='<div class="fld" style="grid-column:1/-1"><label>'+f.n+'</label><div class="rows">';
  arr.forEach(function(row,i){
    h+='<div class="row">'+f.cols.map(function(c){
      var p=path+'.'+i+'.'+c[0], v=row[c[0]];
      if(c[2]==='bool') return '<label><input type="checkbox"'+(v?' checked':'')+' onchange="edit(this,\''+p+'\',\'b\')"> '+c[1]+'</label>';
      if(c[2]==='img') return imgSel('t_'+i,p,v);
      if(c[2]==='area') return '<input type="text" value="'+esc(v)+'" placeholder="'+c[1]+'" style="flex:3 1 320px" oninput="edit(this,\''+p+'\',\'s\')">';
      return '<input type="text" value="'+esc(v)+'" placeholder="'+c[1]+'" oninput="edit(this,\''+p+'\',\'s\')">';
    }).join('')+'<button class="del" type="button" title="Удалить" onclick="rm(\''+path+'\','+i+')">×</button></div>';
  });
  h+='<button class="addbtn" type="button" onclick="add(\''+path+'\',\'row\','+f.cols.length+')">+ добавить строку</button>';
  return h+'</div></div>';
}
function galHtml(path,f,arr){
  var h='<div class="fld" style="grid-column:1/-1"><label>'+f.n+'</label><div class="rows">';
  arr.forEach(function(k,i){
    h+='<div class="row">'+imgSel('g_'+i,path+'.'+i,k)+
       '<button class="del" type="button" onclick="rm(\''+path+'\','+i+')">×</button></div>';
  });
  h+='<button class="addbtn" type="button" onclick="addStr(\''+path+'\')">+ добавить фото</button>';
  return h+'</div></div>';
}
function addStr(path){ var a=get(C,path); if(!Array.isArray(a)){ set(C,path,[]); a=get(C,path); } a.push(''); dirty(); show(SEC); }
function listHtml(path,f,arr){
  var h='<div class="fld" style="grid-column:1/-1"><label>'+f.n+'</label>';
  arr.forEach(function(it,i){
    h+='<div class="grp" style="margin-bottom:10px"><div class="grp-h"><b>'+esc(it[f.label]||('№'+(i+1)))+'</b>'+
       '<button class="del" type="button" onclick="rm(\''+path+'\','+i+')">×</button></div><div class="grp-b">'+
       f.f.map(function(ff){ return fieldHtml(path+'.'+i+'.'+ff.k,ff,get(it,ff.k)); }).join('')+'</div></div>';
  });
  h+='<button class="addbtn" type="button" onclick="add(\''+path+'\',\'obj\')">+ добавить</button>';
  return h+'</div>';
}
function rm(path,i){ if(!confirm('Удалить эту запись?'))return; var a=get(C,path); a.splice(i,1); dirty(); show(SEC); }
function add(path,kind,cols){ var a=get(C,path);
  if(kind==='row'){ var r=[]; for(var i=0;i<cols;i++) r.push(''); a.push(r); }
  else a.push({});
  dirty(); show(SEC); }

function render(k){
  var S=SCHEMA[k], body=document.getElementById('secBody'), h='';
  if(S.kind==='map'){
    Object.keys(C[k]).forEach(function(ck){

      });

    });
  } else if(S.kind==='map3'){
    Object.keys(C[k]).forEach(function(ck){
      h+='<h3 style="margin:22px 0 10px;font-size:17px;color:var(--gold)">'+esc(cityName(ck))+'</h3>';

      });
      h+='<button class="addbtn" type="button" onclick="add(\''+k+'.'+ck+'\',\'obj\')">+ добавить строку</button>';
    });
  }
  body.innerHTML=h;
}

/* ---------- фотографии ---------- */
function imgsView(m){
  var h='<h2>Фотографии</h2><p class="adm-lede">Перетащите файлы сюда — они уменьшатся до 1600 пикселей и превратятся в WebP прямо в браузере. Имя файла станет ключом: его выбирают в полях «Картинка».</p>';
  h+='<div class="drop" id="drop"><b>Перетащите фотографии сюда</b>или <label style="color:var(--azure);cursor:pointer;text-decoration:underline">выберите файлы<input type="file" accept="image/*" multiple hidden onchange="pick(this.files)"></label></div>';
  var all=allImgs();
  h+='<div class="imgs">'+all.map(function(k){
    var isNew=!!NEWIMG[k];
    return '<div class="imgc'+(isNew?' new':'')+'"><img loading="lazy" src="'+imgSrc(k)+'" alt=""><b>'+esc(k)+'</b>'+
      '<span>'+(isNew? ('новая · '+Math.round(NEWIMG[k].bytes/1024)+' КБ') : 'на сайте')+'</span></div>';
  }).join('')+'</div>';
  m.innerHTML=h;
  var d=document.getElementById('drop');
  ['dragenter','dragover'].forEach(function(e){d.addEventListener(e,function(ev){ev.preventDefault();d.classList.add('over');});});
  ['dragleave','drop'].forEach(function(e){d.addEventListener(e,function(ev){ev.preventDefault();d.classList.remove('over');});});
  d.addEventListener('drop',function(ev){ pick(ev.dataTransfer.files); });
  window.scrollTo(0,0);
}
var TRANSLIT={'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y',
 'к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h',
 'ц':'c','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'};
/* Имя файла становится ключом картинки. Кириллицу переводим в латиницу,
   иначе «Отель Тест.jpg» превратился бы в пустую строку. */
function slug(name){
  var s=String(name).toLowerCase().split('').map(function(ch){
    return TRANSLIT[ch]!==undefined? TRANSLIT[ch] : ch; }).join('');
  s=s.replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
  if(!s) s='foto_'+Date.now().toString(36);
  if(/^[0-9]/.test(s)) s='img_'+s;
  return s.slice(0,48);
}
function pick(files){
  var list=Array.prototype.slice.call(files||[]);
  if(!list.length) return;
  var done=0;
  list.forEach(function(f){
    if(!/^image\//.test(f.type)) { done++; return; }
    var key=slug(f.name.replace(/\.[^.]+$/,''));
    var img=new Image(), url=URL.createObjectURL(f);
    img.onload=function(){
      var w=img.width,hh=img.height,max=1600;
      if(w>max){ hh=Math.round(hh*max/w); w=max; }
      var cv=document.createElement('canvas'); cv.width=w; cv.height=hh;
      cv.getContext('2d').drawImage(img,0,0,w,hh);
      cv.toBlob(function(bl){
        var fr=new FileReader();
        fr.onload=function(){
          NEWIMG[key]={url:fr.result, b64:String(fr.result).split(',')[1], bytes:bl.size};
          done++; if(done===list.length){ dirty(); imgsView(document.getElementById('admMain')); }
        };
        fr.readAsDataURL(bl);
        URL.revokeObjectURL(url);
      },'image/webp',0.82);
    };
    img.onerror=function(){ done++; };
    img.src=url;
  });
}

/* ---------- публикация ---------- */
function setView(m){
  m.innerHTML='<h2>Публикация</h2>'+
   '<p class="adm-lede">Правки уходят прямо в репозиторий сайта. Через минуту-полторы GitHub пересобирает страницу, и их видно всем.</p>'+
   '<div class="setbox"><h3>Куда публикуем</h3>'+
   '<div class="fld"><label>Владелец</label><input type="text" id="sOwner" value="'+esc(CFG.owner)+'"></div>'+
   '<div class="fld"><label>Репозиторий</label><input type="text" id="sRepo" value="'+esc(CFG.repo)+'"></div>'+
   '<div class="fld"><label>Ветка</label><input type="text" id="sBranch" value="'+esc(CFG.branch)+'"></div>'+
   '<div class="fld"><label>Ключ доступа</label><input type="text" id="sToken" value="'+esc(localStorage.getItem('izi_token')||'')+'" placeholder="github_pat_…">'+
   '<span class="hint">Создаётся на github.com → Settings → Developer settings → Fine-grained tokens. Дайте доступ только к репозиторию '+esc(CFG.repo)+' и только право Contents: Read and write.</span></div>'+
   '<button class="btn btn-ember btn-s" type="button" onclick="saveCfg()">Запомнить</button>'+
   '<p class="adm-note adm-warn"><b>Про ключ честно.</b> Он хранится в этом браузере и даёт право менять файлы репозитория. Кто сядет за этот компьютер — сможет им воспользоваться. Не открывайте редактор на общем компьютере, а если ключ утёк — удалите его на GitHub, он отзывается одной кнопкой. Когда сайт переедет на свой сервер, вход будет обычный: логин и пароль.</p>'+
   '</div><div class="log" id="admLog">готов к работе\n</div>';
  window.scrollTo(0,0);
}
function saveCfg(){
  CFG.owner=document.getElementById('sOwner').value.trim();
  CFG.repo=document.getElementById('sRepo').value.trim();
  CFG.branch=document.getElementById('sBranch').value.trim()||'main';
  localStorage.setItem('izi_cfg',JSON.stringify(CFG));
  localStorage.setItem('izi_token',document.getElementById('sToken').value.trim());
  log('настройки сохранены','b');
}
function tok(){ return localStorage.getItem('izi_token')||''; }

function ghHeaders(){ return {'Authorization':'Bearer '+tok(),'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}; }
function ghUrl(path){ return 'https://api.github.com/repos/'+CFG.owner+'/'+CFG.repo+'/contents/'+path; }
function ghGetSha(path){
  return fetch(ghUrl(path)+'?ref='+encodeURIComponent(CFG.branch),{headers:ghHeaders()})
    .then(function(r){ return r.ok? r.json().then(function(j){return j.sha;}) : null; })
    .catch(function(){ return null; });
}
function ghPut(path,b64,msg){
  return ghGetSha(path).then(function(sha){
    var body={message:msg,content:b64,branch:CFG.branch};
    if(sha) body.sha=sha;
    return fetch(ghUrl(path),{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)})
      .then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error(r.status+' '+t.slice(0,160)); }); return r.json(); });
  });
}
function b64(str){ return btoa(unescape(encodeURIComponent(str))); }

function publish(){
  if(!tok()){ show('set'); setTimeout(function(){alert('Сначала впишите ключ доступа и нажмите «Запомнить».');},50); return; }
  if(!confirm('Опубликовать правки на сайте?\n\nОни станут видны всем через минуту-полторы.')) return;
  show('set');
  setTimeout(function(){
    C.version=new Date().toISOString().slice(0,10);
    var keys=Object.keys(NEWIMG);
    log('публикую: файл данных'+(keys.length?(' и картинок: '+keys.length):''));
    var chain=Promise.resolve();
    keys.forEach(function(k){
      chain=chain.then(function(){
        log('  картинка '+k+'.webp …');
        return ghPut('assets/img/'+k+'.webp',NEWIMG[k].b64,'Редактор: картинка '+k);
      });
    });
    chain=chain.then(function(){
      log('  data/content.json …');
      return ghPut('data/content.json',b64(JSON.stringify(C,null,1)),'Редактор: обновлено содержимое сайта');
    }).then(function(){
      NEWIMG={}; DIRTY=false; localStorage.removeItem('izi_draft');
      document.getElementById('admDirty').textContent='всё опубликовано';
      document.getElementById('admDirty').className='adm-dirty clean';
      log('готово. Через минуту-полторы правки будут на сайте.','b');
    }).catch(function(e){
      log('не получилось: '+e.message,'i');
      log('Проверьте ключ доступа и права: нужен Contents — Read and write для репозитория '+CFG.repo+'.','i');
    });
  },60);
}
function download(){
  C.version=new Date().toISOString().slice(0,10);
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(C,null,1)],{type:'application/json'}));
  a.download='content.json'; a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  if(Object.keys(NEWIMG).length) alert('Файл данных скачан.\n\nНовые фотографии в него не попадают — их нужно публиковать кнопкой «Опубликовать» или положить в assets/img вручную.');
}

window.addEventListener('beforeunload',function(e){ if(DIRTY){ e.preventDefault(); e.returnValue=''; } });
try{ var c=JSON.parse(localStorage.getItem('izi_cfg')||'null'); if(c) CFG=c; }catch(e){}
boot();
